name: signal-service-platform-local

services:
  postgres:
    image: postgres:16
    container_name: signal-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal_service
      POSTGRES_USER: signal_user
      POSTGRES_PASSWORD: signal_password
    ports:
      - "5432:5432"
    volumes:
      - signal-service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_user -d signal_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: signal-service-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - signal-service-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  signal-service-postgres-data:
  signal-service-redis-data:
